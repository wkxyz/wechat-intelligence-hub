name: Local connector checks
on:
  push:
    branches: ['codex/local-connector', 'codex/host-integration']
  pull_request:
    paths:
      - 'projects/wechat-bot-connector/**'
      - '.github/workflows/local-connector.yml'
      - 'projects/rion-wechat-reader/**'
      - 'projects/wechat-intelligence-hub/wechat_query.py'
  workflow_dispatch:
  workflow_call:
concurrency:
  group: local-connector-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read dependencies
        run: |
          python -m pip install --only-binary=:all: sqlcipher3==0.6.2 zstandard==0.25.0 Pillow==11.3.0
      - name: Native window dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb fonts-noto-cjk
      - name: Connection, real worker and native GUI tests
        env:
          CONNECTOR_GUI_TEST: '1'
          CONNECTOR_SCREENSHOT_DIR: ui-evidence
        run: |
          xvfb-run -a python -m unittest discover -s projects/wechat-bot-connector/tests -v
      - name: Window evidence
        uses: actions/upload-artifact@v4
        with:
          name: connector-ui-evidence
          path: ui-evidence
  portable:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows-x64
            executable: dist/wechat-connector/wechat-connector.exe
          - os: macos-14
            name: macOS-arm64
            executable: dist/wechat-connector/wechat-connector
          - os: macos-15-intel
            name: macOS-x64
            executable: dist/wechat-connector/wechat-connector
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build dependencies
        run: |
          python -m pip install --only-binary=:all: sqlcipher3==0.6.2 zstandard==0.25.0 pyinstaller==6.22.3
      - name: Build portable connector
        run: |
          python projects/wechat-bot-connector/scripts/build_portable.py
      - name: Packaged dependency smoke check
        run: |
          ${{ matrix.executable }} --self-test
      - name: Packaged native window smoke check
        run: |
          ${{ matrix.executable }} --self-test-ui
      - name: Packaged workers and MCP with generated databases
        env:
          CONNECTOR_TEST_EXECUTABLE: ${{ matrix.executable }}
        run: |
          python -m unittest discover -s projects/wechat-bot-connector/tests -v
      - name: Archive portable folder
        run: |
          python -c "import shutil; shutil.make_archive('wechat-connector-${{ matrix.name }}', 'zip', 'dist', 'wechat-connector')"
      - uses: actions/upload-artifact@v4
        with:
          name: wechat-connector-${{ matrix.name }}
          path: wechat-connector-${{ matrix.name }}.zip
          retention-days: 30
