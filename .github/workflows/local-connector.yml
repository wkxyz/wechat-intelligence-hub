name: Local connector checks
on:
  push:
    branches: ['codex/local-connector']
  pull_request:
    paths:
      - 'projects/wechat-bot-connector/**'
      - '.github/workflows/local-connector.yml'
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Connection and pairing tests
        run: python -m unittest discover -s projects/wechat-bot-connector/tests -v
